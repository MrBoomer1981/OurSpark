# Локальный Postgres для services/api: docker compose up -d
# Версия — как у Postgres на Railway (шаблон Railway даёт 18).
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: gnezdo
      POSTGRES_PASSWORD: gnezdo
      POSTGRES_DB: gnezdo
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql

volumes:
  postgres:
