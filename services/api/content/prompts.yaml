# Карточки «Послания дня».
#
# Ключ карточки и ключи вариантов постоянные: после первого показа их не меняют и карточки
# не удаляют — по ключам база помнит ответы и завершённые послания. Текст править можно.
# Тексты: никаких родовых окончаний у участников («выбрал(а)», «хотел(а) бы», «готов(а)» нельзя —
# годятся настоящее и будущее время, «хочется», «тебе ближе»), имена — в именительном падеже.
# Не тест и не диагностика отношений: никаких «правильных» ответов и давления на откровенность.
# Текст с двоеточием берите в кавычки, иначе YAML прочтёт его не как текст.
#
# kind — тип; доли, с которыми типы выпадают, заданы в коде (app/content: KINDS):
#   light — лёгкий: каждый выбирает вариант о себе;
#   closeness — о близости: каждый отвечает текстом; вариантов нет, шкалы не двигает;
#   guess — «Угадай партнёра»: каждый выбирает вариант о себе и прогноз варианта партнёра;
#   choice — совместный выбор: каждый выбирает вариант за пару; шкала нужна у каждого варианта.
# theme — тема из themes.yaml: три завершённых послания одной темы приносят паре её реликвию.
# trait — шкала питомца, которую сдвигает вариант (ключ из pet.yaml); у лёгких и «Угадай» — по желанию.
# chronicle — запись летописи на случай, когда вариант выбрали оба; без неё совпадение в летопись не попадает.
#
# Черновики Claude — автор проекта их правит.

