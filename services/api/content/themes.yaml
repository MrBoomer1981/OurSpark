# Темы посланий и их реликвии. Реликвия темы — паре за три завершённых послания этой темы,
# в любом порядке и с любыми перерывами. Реликвии не тратятся и не теряются.
#
# Ключ темы постоянный — на него ссылаются карточки в prompts.yaml и база; тексты менять можно.
# В теме должно быть хотя бы три карточки, иначе реликвию не получить — загрузчик такую тему не пропустит.
# Тексты: никаких родовых окончаний у участников и питомца; текст с двоеточием — в кавычках.

home:
  name: Уют
  relic: Камешек-грелка
  relic_text: Хранит тепло всех вечеров в гнезде.

adventure:
  name: Приключения
  relic: Компас без стрелки
  relic_text: Всегда показывает в сторону следующего приключения.
