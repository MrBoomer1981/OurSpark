# Темы посланий и их реликвии. Реликвия темы — паре за три завершённых послания этой темы,
# в любом порядке и с любыми перерывами. Реликвии не тратятся и не теряются.
#
# Ключ темы постоянный — на него ссылаются карточки в prompts.yaml и база; тексты менять можно.
# В теме должно быть хотя бы три карточки, иначе реликвию не получить — загрузчик такую тему не пропустит.
# Тексты: никаких родовых окончаний у участников и питомца; текст с двоеточием — в кавычках.

home:
  name: Уют
  relic: Камешек-грелка
  relic_text: Хранит тепло всех вечеров в гнезде.

adventure:
  name: Приключения
  relic: Компас без стрелки
  relic_text: Всегда показывает в сторону следующего приключения.

memories:
  name: Воспоминания
  relic: Засушенный лепесток
  relic_text: Хранит запах дня, который не хочется забывать.

care:
  name: Забота
  relic: Шарф с вышитым пером
  relic_text: Греет, даже когда вы далеко друг от друга.

dreams:
  name: Мечты
  relic: Звезда в склянке
  relic_text: Светит ярче, когда кто-то загадывает желание.

tastes:
  name: Вкусы
  relic: Серебряная ложечка
  relic_text: Помнит, кто какой чай любит и сколько ложек сахара кладёт.

tales:
  name: Сказки
  relic: Склянка с туманом
  relic_text: Внутри клубится туман из старой сказки. Если прислушаться — слышно, как она продолжается.

distance:
  name: На расстоянии
  relic: Письмо с сургучной печатью
  relic_text: Его можно перечитывать сколько угодно — слова в нём не выцветают.

seasons:
  name: Времена года
  relic: Янтарный кленовый лист
  relic_text: В нём застыла осень, которая никогда не кончается.

laughter:
  name: Смех
  relic: Колокольчик шута
  relic_text: Звенит каждый раз, когда в гнезде кто-то смеётся.
