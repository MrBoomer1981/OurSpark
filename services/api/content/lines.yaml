# Реплики питомца.
# Тексты: никаких родовых окончаний у участников («ответил», «оба» нельзя), имена — в именительном падеже.
# Питомец тоже без рода: его внешность и характер ещё не решены.
# В каждой группе может быть несколько реплик: питомец берёт одну и при повторном показе
# говорит то же самое. Реплику с двоеточием берите в кавычки, иначе YAML прочтёт её не как текст.

# Реплика в Гнезде — по состоянию послания дня.
nest:
  idle:
    - Кар! Я тут, в гнезде. Тепло и немного пахнет свечами.
    - Сегодня мне снились ключи. Много-много ключей.
  your_turn:
    - Послание дня ждёт. Мне ужасно любопытно, что ты скажешь.
    - Послание дня уже здесь — лежит под крылом и ждёт ответа.
  partner_answered:
    - Ответ партнёра уже здесь. Я не подглядываю — только чуть-чуть ёрзаю.
  waiting:
    - Твой выбор у меня под крылом. Ждём вторую половину гнезда.
    - Сижу и стерегу твой ответ. Никому не покажу, пока не будет двух ответов.
  ready:
    - Оба ответа на месте! Откроем?
  done:
    - Сегодняшнее послание прочитано. Завтра принесу новое.

# Реакция на свой выбор — по шкале выбранного варианта.
answer:
  curiosity:
    - О, любопытно! Положу это рядом с картой неизведанного.
  mischief:
    - Хи-хи. Кажется, в гнезде намечается шалость.
  tenderness:
    - Как тепло. Укрою этот выбор пёрышком.
  courage:
    - Смело! У меня даже перья встали дыбом.

# Реакция на свой ответ без шкалы — по типу вопроса. В «Угадай партнёра» питомец всегда
# говорит отсюда: главное в таком ответе — прогноз.
reply:
  light:
    - Записано! Теперь я знаю о тебе на одну маленькую вещь больше.
  closeness:
    - Спасибо, что делишься. Сберегу эти слова до ответа партнёра.
    - Тёплые слова. Спрячу их под крыло — там они не остынут.
  guess:
    - Прогноз запечатан в конверт. Вскроем, когда ответит партнёр.
    - Прогноз принят и спрятан. Даже я не подсматриваю.

# Общая реакция после раскрытия — по типу вопроса. {option} — вариант, который выбран обоими.
reveal:
  # совместный выбор
  same:
    - Вы выбрали одно и то же — «{option}». Значит, так тому и быть.
  different:
    - "Ответы разные — и это прекрасно: в гнезде хватит места и тому, и другому."
  # лёгкий вопрос
  light_same:
    - Одинаковый ответ — «{option}». Гнездо одобрительно поскрипывает.
  light_different:
    - Ответы разные — значит, будет о чём поболтать.
  # о близости
  closeness:
    - Ваши слова теперь рядом. Я посижу тихонько, пока вы читаете.
  # «Угадай партнёра»: сколько прогнозов сбылось
  guess_both:
    - Два прогноза из двух — в точку! Кажется, в гнезде завелись телепаты.
  guess_one:
    - Один прогноз сбылся, второй — отличный повод расспросить друг друга.
  guess_none:
    - Ни один прогноз не сбылся — значит, вам ещё есть чем друг друга удивлять.

# Летопись: записи о событиях. Записи о совпавших выборах — у вариантов в prompts.yaml.
# {name} — название стадии или реликвии, {text} — описание реликвии, {habit} — привычка из pet.yaml.
chronicle:
  hatch:
    - Скорлупа треснула, и в гнезде стало на одного жильца больше. С этого начинается летопись.
  stage:
    - Новая стадия — «{name}». Гнездо как будто стало теснее.
  habit:
    - Появилась привычка. {habit}
  relic:
    - Найдена реликвия — «{name}». {text}
