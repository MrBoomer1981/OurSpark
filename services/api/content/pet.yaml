# Питомец: стадии роста, шкалы характера с порогами, косметика.
#
# Ключи постоянные — на них ссылаются карточки и база; названия, тексты и числа менять можно.
# Тексты: никаких родовых окончаний ни у участников, ни у питомца («вырос», «нашла» нельзя).
# Текст с двоеточием берите в кавычки, иначе YAML прочтёт его не как текст.
# Числа стартовые: баланс подбираем на этапе 4. Послание приносит паре 20 искр.

# Стадии по порядку. Стадия открывается сама, когда пара заработала столько искр за всё время
# (траты не в счёт); проверяется при раскрытии послания. Первая — с самого начала, sparks: 0.
# line — реакция питомца на рост (у первой стадии её нет).
stages:
  - key: foundling
    name: Найдёныш
    sparks: 0
  - key: companion
    name: Любопытный спутник
    sparks: 300
    line: Крылья стали шире, а мир — интереснее. Теперь я Любопытный спутник!
  - key: keeper
    name: Хранитель гнезда
    sparks: 900
    line: Теперь гнездо под моим крылом. Я — Хранитель гнезда.

# Шкалы характера. Описывают только питомца, не пару, и никогда не убывают.
# levels — пороги: когда шкала дорастает до порога, открывается привычка.
# habit — описание на экране «Питомец», line — реплика в Гнезде, когда послание дня прочитано.
traits:
  curiosity:
    name: Любопытство
    levels:
      - key: shiny
        at: 3
        habit: Прячет под крыло всё блестящее.
        line: Под крылом у меня пуговица, ключик и что-то круглое. Не спрашивай.
      - key: maps
        at: 6
        habit: По ночам изучает старые карты.
        line: На карте есть место без названия. Как думаешь, что там?
  mischief:
    name: Озорство
    levels:
      - key: hide-and-seek
        at: 3
        habit: Прячет ваши вещи и делает вид, что так и было.
        line: Если что-то пропало — это не я. Почти точно не я.
      - key: riddles
        at: 6
        habit: Сочиняет загадки и прячет отгадки по гнезду.
        line: Что можно взять, но нельзя унести? Отгадка спрятана в гнезде.
  tenderness:
    name: Нежность
    levels:
      - key: feather-blanket
        at: 3
        habit: Укрывает пёрышком всё, что любит.
        line: Вам тепло? Мне — очень.
      - key: quiet-caw
        at: 6
        habit: Встречает вас тихим «кар».
        line: Кар. Это значит «я рядом».
  courage:
    name: Смелость
    levels:
      - key: edge
        at: 3
        habit: Сидит на самом краю гнезда и не боится высоты.
        line: С края гнезда видно всю улицу. И немного неба.
      - key: night-watch
        at: 6
        habit: Обходит гнездо ночным дозором.
        line: Ночной дозор пройден. Чудовищ не обнаружено. Почти.

# Слоты косметики: куда надевается предмет. В слоте — один предмет.
slots:
  feathers: Перья
  neck: Подвеска
  cloak: Плащ
  mask: Маска
  nest: Гнездо

# Косметика за искры. requires — когда предмет появляется в продаже: стадия (stage: <ключ>)
# или порог шкалы (trait: <ключ>, at: <число>); без requires — сразу. Купленный предмет остаётся
# у пары навсегда. line — реакция питомца на обнову.
items:
  - key: raven-feather
    slot: feathers
    name: Воронье перо
    price: 40
    line: Перо к лицу. То есть к клюву.
  - key: nest-candle
    slot: nest
    name: Свеча в гнезде
    price: 50
    line: Свеча горит — значит, в гнезде кто-то есть.
  - key: copper-key
    slot: neck
    name: Медный ключик на шнурке
    price: 60
    line: Ключик звенит при каждом шаге. Интересно, от какой он двери?
  - key: leaf-garland
    slot: nest
    name: Гирлянда из сухих листьев
    price: 80
    line: Шуршит, когда дует ветер. Красота!
  - key: owl-feather
    slot: feathers
    name: Совиное перо
    price: 120
    requires: {trait: curiosity, at: 6}
    line: Совы знают много тайн. Теперь и у меня есть одна.
  - key: lantern
    slot: nest
    name: Фонарь со светлячками
    price: 120
    requires: {trait: courage, at: 6}
    line: Со светлячками даже ночной дозор не страшен.
  - key: moon-pendant
    slot: neck
    name: Лунная подвеска
    price: 150
    requires: {trait: tenderness, at: 6}
    line: Подвеска светится, когда вы рядом.
  - key: jester-mask
    slot: mask
    name: Шутовская полумаска
    price: 150
    requires: {trait: mischief, at: 6}
    line: Угадай, кто под маской? Подсказка — это я.
  - key: mini-cloak
    slot: cloak
    name: Мини-плащ
    price: 200
    requires: {stage: companion}
    line: Плащ развевается, даже когда ветра нет. Это талант.
  - key: plague-mask
    slot: mask
    name: Маска чумного доктора
    price: 250
    requires: {stage: companion}
    line: В этой маске я выгляжу очень серьёзно. Правда?
